apiVersion: v1
kind: ConfigMap
metadata:
  name: ai-proxy-nginx
  namespace: ai-gateway
data:
  default.conf: |
    server {
        listen 80;
        server_name localhost;

        resolver 10.43.0.10 8.8.8.8 valid=30s ipv6=off;
        set $nvidia_upstream "https://integrate.api.nvidia.com";

        # 1. 지능형 라우팅 진입점 (/v1/smart-chat -> /v1/chat/completions 로 정확히 URL Rewrite)
        location /v1/smart-chat {
            rewrite ^/v1/smart-chat(.*)$ /v1/chat/completions break;
            
            proxy_pass $nvidia_upstream;
            proxy_ssl_server_name on;
            proxy_ssl_name integrate.api.nvidia.com;
            proxy_ssl_protocols TLSv1.2 TLSv1.3;

            proxy_set_header Host integrate.api.nvidia.com;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_pass_request_headers on;

            add_header X-Routed-Endpoint "/v1/chat/completions" always;
            add_header X-LB-Pod "$HOSTNAME" always;
            add_header X-LB-Node "$server_addr" always;
        }

        # 2. 기본 OpenAI 호환 경로
        location /v1/chat/completions {
            proxy_pass $nvidia_upstream;
            proxy_ssl_server_name on;
            proxy_ssl_name integrate.api.nvidia.com;
            proxy_ssl_protocols TLSv1.2 TLSv1.3;

            proxy_set_header Host integrate.api.nvidia.com;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_pass_request_headers on;

            add_header X-LB-Pod "$HOSTNAME" always;
            add_header X-LB-Node "$server_addr" always;
        }
    }
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: ai-proxy-router
  namespace: ai-gateway
spec:
  replicas: 3
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: ai-proxy
  template:
    metadata:
      labels:
        app: ai-proxy
    spec:
      affinity:
        podAntiAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
          - labelSelector:
              matchExpressions:
              - key: app
                operator: In
                values:
                - ai-proxy
            topologyKey: "kubernetes.io/hostname"
      containers:
      - name: nginx-proxy
        image: nginx:alpine
        ports:
        - containerPort: 80
        volumeMounts:
        - name: nginx-config
          mountPath: /etc/nginx/conf.d/default.conf
          subPath: default.conf
      volumes:
      - name: nginx-config
        configMap:
          name: ai-proxy-nginx
