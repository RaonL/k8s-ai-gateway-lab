apiVersion: v1
kind: ConfigMap
metadata:
  name: ai-proxy-nginx
  namespace: ai-gateway
data:
  default.conf.template: |
    server {
      listen 80;
      server_tokens off;

      location = /healthz {
        access_log off;
        add_header Content-Type text/plain;
        return 200 'ok';
      }

      location /v1/ {
        proxy_http_version 1.1;
        proxy_ssl_server_name on;
        proxy_set_header Host integrate.api.nvidia.com;
        proxy_set_header Authorization "Bearer ${NVIDIA_API_KEY}";
        proxy_set_header Content-Type $content_type;
        proxy_set_header X-Request-ID $request_id;
        proxy_set_header Connection "";
        proxy_buffering off;
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;
        proxy_pass https://integrate.api.nvidia.com;
      }

      location / {
        return 404;
      }
    }
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: ai-proxy-router
  namespace: ai-gateway
  labels:
    app: ai-proxy
spec:
  replicas: 3
  selector:
    matchLabels:
      app: ai-proxy
  template:
    metadata:
      labels:
        app: ai-proxy
    spec:
      affinity:
        podAntiAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
            - labelSelector:
                matchExpressions:
                  - key: app
                    operator: In
                    values: [ai-proxy]
              topologyKey: kubernetes.io/hostname
      containers:
        - name: nginx-proxy
          image: nginx:1.27-alpine
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 80
          env:
            - name: NVIDIA_API_KEY
              valueFrom:
                secretKeyRef:
                  name: nvidia-secret
                  key: api-key
          volumeMounts:
            - name: nginx-template
              mountPath: /etc/nginx/templates/default.conf.template
              subPath: default.conf.template
              readOnly: true
          readinessProbe:
            httpGet:
              path: /healthz
              port: http
            initialDelaySeconds: 3
            periodSeconds: 5
          livenessProbe:
            httpGet:
              path: /healthz
              port: http
            initialDelaySeconds: 10
            periodSeconds: 10
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              cpu: 250m
              memory: 128Mi
      volumes:
        - name: nginx-template
          configMap:
            name: ai-proxy-nginx
